[project]
name = "tabchat"
version = "0.1.0"
description = "Lightweight local-first chat & prediction web app for TabPFN-3.5"
readme = "README.md"
authors = [
    { name = "Aniket Kharad", email = "92918607+aniketkharad@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_relpilot.py"

